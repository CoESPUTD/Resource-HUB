<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU - Operational Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --accent: #d4af37;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(212, 175, 55, 0.25);
            --green: #22c55e;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tabellone Operativo Training Dept</h1>
        <p class="subtitle">Stato Occupazione Aule & Disponibilità Istruttori</p>
    </header>

    <div class="dashboard-grid">
        <!-- PANNELLO AULE -->
        <div class="panel">
            <div class="panel-title">🏫 Stato Aule</div>
            <div id="auleContainer" class="loading">Caricamento aule...</div>
        </div>

        <!-- PANNELLO ISTRUTTORI -->
        <div class="panel">
            <div class="panel-title">👨‍🏫 Stato Istruttori</div>
            <div id="istruttoriContainer" class="loading">Caricamento istruttori...</div>
        </div>
    </div>

<script>
    // INSERISCI QUI I DUE LINK CSV PUBBLICATI DA GOOGLE SHEETS
    const LINK_CSV_AULE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?gid=1402761773&single=true&output=csv";
    const LINK_CSV_ISTRUTTORI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?gid=87992488&single=true&output=csv";

    // Utility per parsing righe CSV tenendo conto dei campi tra virgolette
    function parseCSVLine(text) {
        let result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') {
                inQuotes = !inQuotes;
            } else if (c === ',' && !inQuotes) {
                result.push(cur.trim());
                cur = '';
            } else {
                cur += c;
            }
        }
        result.push(cur.trim());
        return result;
    }

    async function caricaDashboard() {
        caricaAule();
        caricaIstruttori();
    }

    async function caricaAule() {
        const container = document.getElementById('auleContainer');
        try {
            const res = await fetch(LINK_CSV_AULE);
            const data = await res.text();
            const righe = data.split(/\r?\n/);

            let html = `<table>
                <thead>
                    <tr>
                        <th>Aula</th>
                        <th>Stato / Corso</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody>`;

            let contaAule = 0;
            for (let i = 1; i < righe.length; i++) {
                if (!righe[i].trim()) continue;
                const col = parseCSVLine(righe[i]);
                
                const nomeAula = col[0] || '';
                const corso = col[1] || 'Libera';
                const note = col[2] || '-';

                if (!nomeAula) continue;
                contaAule++;

                const isOccupata = corso.toLowerCase() !== 'libera' && corso !== '-' && corso !== '';
                const badgeClass = isOccupata ? 'badge-danger' : 'badge-success';

                html += `
                    <tr>
                        <td><strong>${nomeAula}</strong></td>
                        <td><span class="badge ${badgeClass}">${corso}</span></td>
                        <td style="color:var(--text-muted);">${note}</td>
                    </tr>`;
            }

            html += `</tbody></table>`;
            container.innerHTML = contaAule > 0 ? html : "<p class='loading'>Nessuna aula trovata.</p>";

        } catch (e) {
            console.error("Errore caricamento aule:", e);
            container.innerHTML = "<p style='color:var(--red)'>Errore nel caricamento delle aule.</p>";
        }
    }

    async function caricaIstruttori() {
        const container = document.getElementById('istruttoriContainer');
        try {
            const res = await fetch(LINK_CSV_ISTRUTTORI);
            const data = await res.text();
            const righe = data.split(/\r?\n/);

            let html = `<table>
                <thead>
                    <tr>
                        <th>Istruttore</th>
                        <th>In Sede</th>
                        <th>Note / Info</th>
                    </tr>
                </thead>
                <tbody>`;

            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);

            let contaIstruttori = 0;
            for (let i = 1; i < righe.length; i++) {
                if (!righe[i].trim()) continue;
                const col = parseCSVLine(righe[i]);

                const nomeIstruttore = col[0] || '';
                const inizioLicenzaStr = col[1] || '';
                const fineLicenzaStr = col[2] || '';
                const note = col[3] || '';

                if (!nomeIstruttore) continue;
                contaIstruttori++;

                // LOGICA STATO IN SEDE
                // Di default -> IN SEDE (Sì, Verde)
                let inSede = true;
                let dettaglio = "";

                if (inizioLicenzaStr && fineLicenzaStr) {
                    const inizio = new Date(inizioLicenzaStr);
                    const fine = new Date(fineLicenzaStr);

                    if (!isNaN(inizio.getTime()) && !isNaN(fine.getTime())) {
                        inizio.setHours(0, 0, 0, 0);
                        fine.setHours(23, 59, 59, 999);

                        // Diventa "In Licenza" (Rosso) SOLO SE la data odierna cade tra Inizio e Fine
                        if (oggi >= inizio && oggi <= fine) {
                            inSede = false;
                            dettaglio = ` (In licenza fino al ${fine.toLocaleDateString('it-IT')})`;
                        }
                    }
                }

                const badgeClass = inSede ? 'badge-success' : 'badge-danger';
                const badgeTesto = inSede ? 'Sì' : 'In Licenza';
                const noteFinale = (note && note !== '-' ? note : '') + dettaglio;

                html += `
                    <tr>
                        <td><strong>${nomeIstruttore}</strong></td>
                        <td><span class="badge ${badgeClass}">${badgeTesto}</span></td>
                        <td style="color:var(--text-muted);">${noteFinale || '-'}</td>
                    </tr>`;
            }

            html += `</tbody></table>`;
            container.innerHTML = contaIstruttori > 0 ? html : "<p class='loading'>Nessun istruttore trovato.</p>";

        } catch (e) {
            console.error("Errore caricamento istruttori:", e);
            container.innerHTML = "<p style='color:var(--red)'>Errore nel caricamento degli istruttori.</p>";
        }
    }

    window.onload = caricaDashboard;
</script>
</body>
</html>
