<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU - Operational Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --accent: #d4af37;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(212, 175, 55, 0.25);
            --green: #22c55e;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tabellone Operativo Training Dept</h1>
        <p class="subtitle">Stato Occupazione Aule & Disponibilità Istruttori</p>
    </header>

    <div class="dashboard-grid">
        
        <!-- PANNELLO AULE -->
        <div class="panel">
            <div class="panel-title">🏫 Stato Aule</div>
            <div id="auleContainer" class="loading">Caricamento dati aule in corso...</div>
        </div>

        <!-- PANNELLO ISTRUTTORI -->
        <div class="panel">
            <div class="panel-title">👨‍🏫 Stato Istruttori</div>
            <div id="istruttoriContainer" class="loading">Caricamento dati istruttori in corso...</div>
        </div>

    </div>

<script>
    // Incolla qui il tuo link CSV pubblicato da Google Fogli
    const LINK_CSV_DASHBOARD = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?output=csv";

    async function caricaDashboard() {
        try {
            const response = await fetch(LINK_CSV_DASHBOARD);
            const data = await response.text();
            const righe = data.split(/\r?\n/);

            let auleList = [];
            let istruttoriList = [];

            for (let i = 1; i < righe.length; i++) {
                if (!righe[i]) continue;
                const col = righe[i].split(',');

                const tipo = col[2] ? col[2].toLowerCase().trim() : '';
                
                // Gestione Aule
                if (tipo === 'aula') {
                    auleList.push({
                        nome: col[3] ? col[3].trim() : '-',
                        corso: col[4] ? col[4].trim() : 'Libera',
                        note: col[5] ? col[5].trim() : '-'
                    });
                }
                
                // Gestione Istruttori
                if (tipo === 'istruttore') {
                    istruttoriList.push({
                        nome: col[3] ? col[3].trim() : '-',
                        inizioLicenza: col[4] ? col[4].trim() : '',
                        fineLicenza: col[5] ? col[5].trim() : '',
                        note: col[6] ? col[6].trim() : '-'
                    });
                }
            }

            renderAule(auleList);
            renderIstruttori(istruttoriList);

        } catch (error) {
            console.error("Errore nel caricamento della dashboard:", error);
            document.getElementById('auleContainer').innerHTML = "<p style='color:var(--red)'>Errore di caricamento dati.</p>";
            document.getElementById('istruttoriContainer').innerHTML = "<p style='color:var(--red)'>Errore di caricamento dati.</p>";
        }
    }

    function renderAule(aule) {
        const container = document.getElementById('auleContainer');
        if (aule.length === 0) {
            container.innerHTML = "<p class='loading'>Nessuna aula registrata.</p>";
            return;
        }

        let html = `<table>
            <thead>
                <tr>
                    <th>Aula</th>
                    <th>Corso Occupante</th>
                    <th>Note / Stato</th>
                </tr>
            </thead>
            <tbody>`;

        aule.forEach(a => {
            const isOccupata = a.corso && a.corso.toLowerCase() !== 'libera' && a.corso !== '-';
            const badgeClass = isOccupata ? 'badge-danger' : 'badge-success';
            const statoTesto = isOccupata ? a.corso : 'Libera';

            html += `
                <tr>
                    <td><strong>${a.nome}</strong></td>
                    <td><span class="badge ${badgeClass}">${statoTesto}</span></td>
                    <td style="color:var(--text-muted);">${a.note}</td>
                </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function renderIstruttori(istruttori) {
        const container = document.getElementById('istruttoriContainer');
        if (istruttori.length === 0) {
            container.innerHTML = "<p class='loading'>Nessun istruttore registrato.</p>";
            return;
        }

        let html = `<table>
            <thead>
                <tr>
                    <th>Istruttore</th>
                    <th>In Sede</th>
                    <th>Note / Info</th>
                </tr>
            </thead>
            <tbody>`;

        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);

        istruttori.forEach(i => {
            // LOGICA CORRETTA PER LE LICENZE:
            // Di default l'istruttore è IN SEDE (Sì) con Badge VERDE
            let inSede = true;
            let dettaglioLicenza = "";

            // Controlla la licenza SOLO SE entrambe le date sono presenti
            if (i.inizioLicenza && i.fineLicenza) {
                const inizio = new Date(i.inizioLicenza);
                const fine = new Date(i.fineLicenza);

                // Verifica che le date inserite siano valide
                if (!isNaN(inizio.getTime()) && !isNaN(fine.getTime())) {
                    inizio.setHours(0,0,0,0);
                    fine.setHours(23,59,59,999);

                    // Se la data di oggi rientra nel periodo di licenza -> ASSENTE
                    if (oggi >= inizio && oggi <= fine) {
                        inSede = false;
                        dettaglioLicenza = ` (Licenza fino al ${fine.toLocaleDateString('it-IT')})`;
                    }
                }
            }

            const badgeClass = inSede ? 'badge-success' : 'badge-danger';
            const testoBadge = inSede ? 'Sì' : 'In Licenza';
            const noteTesto = (i.note !== '-' ? i.note : '') + dettaglioLicenza;

            html += `
                <tr>
                    <td><strong>${i.nome}</strong></td>
                    <td><span class="badge ${badgeClass}">${testoBadge}</span></td>
                    <td style="color:var(--text-muted);">${noteTesto || '-'}</td>
                </tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    window.onload = caricaDashboard;
</script>
</body>
</html>
