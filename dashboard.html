<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU - Operational Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: rgba(16, 22, 42, 0.9);
            --accent-gold: #d4af37;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Schermata Login */
        #loginScreen { background: rgba(16, 22, 42, 0.95); padding: 30px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.4); text-align: center; margin: 8vh auto 0 auto; max-width: 380px; width: 100%; }
        .lock-icon { font-size: 2.5rem; margin-bottom: 10px; display: inline-block; }
        #loginScreen h2 { margin-bottom: 20px; color: var(--text-main); font-size: 1.2rem; text-transform: uppercase; }
        #loginScreen h2 span { color: var(--accent-gold); font-size: 0.85rem; display: block; margin-top: 5px; }
        .pass-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(10, 15, 29, 0.8); color: white; text-align: center; font-size: 1.1rem; margin-bottom: 15px; letter-spacing: 3px; }
        .login-btn { background: linear-gradient(135deg, #b8921a, var(--accent-gold)); color: #05050a; font-weight: 700; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        .err-msg { color: var(--danger); font-size: 0.8rem; margin-top: 10px; display: none; }

        /* Contenuto Dashboard */
        #dashboardContent { display: none; width: 100%; height: calc(100vh - 30px); flex-direction: column; }
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; flex-shrink: 0; }
        header h1 { font-size: 1.5rem; color: var(--text-main); font-weight: 700; }
        header h1 span { color: var(--accent-gold); font-weight: 400; }
        .clock { font-size: 1.3rem; font-weight: 600; color: var(--accent-gold); background: rgba(212, 175, 55, 0.1); padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.2); }

        /* Contenitore Diapositive */
        .slide-container { flex-grow: 1; position: relative; width: 100%; }
        .panel { background: var(--panel-bg); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); padding: 15px; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; display: flex; flex-direction: column; }
        .panel.active { opacity: 1; pointer-events: auto; }
        
        .panel-title { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; color: var(--text-main); margin-bottom: 15px; border-bottom: 2px solid var(--accent-gold); padding-bottom: 6px; width: fit-content; }

        /* Configurazione Tabelle - Aumentato Font Generale */
        .table-responsive { overflow: hidden; flex-grow: 1; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; color: #e5e7eb; table-layout: fixed; }
        th { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); padding: 10px 6px; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* Dimensionamento colonne Slide 1 (Aule) */
        #tableAule th:nth-child(1), #tableAule td:nth-child(1) { width: 13%; } 
        #tableAule th:nth-child(2), #tableAule td:nth-child(2) { width: 6%; }  
        #tableAule th:nth-child(3), #tableAule td:nth-child(3) { width: 12%; } 
        #tableAule th:nth-child(4), #tableAule td:nth-child(4) { width: 7%; }  
        #tableAule th:nth-child(5), #tableAule td:nth-child(5) { width: 7%; }  
        #tableAule th:nth-child(6), #tableAule td:nth-child(6) { width: 7%; }  
        #tableAule th:nth-child(7), #tableAule td:nth-child(7) { width: 16%; } 
        #tableAule th:nth-child(8), #tableAule td:nth-child(8) { width: 16%; } 
        #tableAule th:nth-child(9), #tableAule td:nth-child(9) { width: 16%; } 
        #tableAule th:nth-child(10), #tableAule td:nth-child(10) { width: 10%; } 

        /* Layout sdoppiato per Slide 2 (Istruttori) */
        .split-tables-container { display: flex; gap: 20px; width: 100%; height: 100%; }
        .split-column { width: 50%; display: flex; flex-direction: column; }

        /* Indicatori delle Pagine */
        .dots-indicator { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-shrink: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); }
        .dot.active { background: var(--accent-gold); box-shadow: 0 0 6px var(--accent-gold); }

        /* Badge di Stato */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
        .badge.libera { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.occupata { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.insede { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge.licenza { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge.missione { background: rgba(59, 130, 246, 0.15); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge.assente { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

    <div id="loginScreen">
        <span class="lock-icon">🦅</span>
        <h2>Training Department <span>Operational Dashboard</span></h2>
        <input type="password" id="passwordInput" class="pass-input" placeholder="PASSWORD" onkeydown="if(event.key==='Enter') verificaPassword()">
        <button onclick="verificaPassword()" class="login-btn">Accedi</button>
        <div id="errorMsg" class="err-msg">Password errata.</div>
    </div>

    <div id="dashboardContent">
        <header>
            <h1>Training Dept. | <span>Operational Board</span></h1>
            <div class="clock" id="liveClock">00:00:00</div>
        </header>

        <div class="slide-container">
            <div class="panel active" id="slideAule">
                <div class="panel-title">🏛️ Monitoraggio Aree Addestrative & Aule</div>
                <div class="table-responsive">
                    <table id="tableAule">
                        <thead>
                            <tr>
                                <th>Aula</th>
                                <th>Posti</th>
                                <th>Corso</th>
                                <th>Dal</th>
                                <th>Al</th>
                                <th>Pres.</th>
                                <th>Acad. Coord.</th>
                                <th>Course Mgr</th>
                                <th>Course Asst</th>
                                <th>Stato</th>
                            </tr>
                        </thead>
                        <tbody id="bodyAule">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="panel" id="slideIstruttori">
                <div class="panel-title">👥 Stato d'Impiego Personale / Istruttori</div>
                <div class="split-tables-container">
                    
                    <div class="split-column">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 30%;">Stato</th>
                                    <th style="width: 70%;">Militare</th>
                                </tr>
                            </thead>
                            <tbody id="bodyIstruttoriSinistra">
                                </tbody>
                        </table>
                    </div>

                    <div class="split-column">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 30%;">Stato</th>
                                    <th style="width: 70%;">Militare</th>
                                </tr>
                            </thead>
                            <tbody id="bodyIstruttoriDestra">
                                </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

        <div class="dots-indicator">
            <div class="dot active" id="dot1"></div>
            <div class="dot" id="dot2"></div>
        </div>
    </div>

<script>
    const LINK_CSV_AULE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?gid=1402761773&single=true&output=csv";
    const LINK_CSV_ISTRUTTORI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?gid=87992488&single=true&output=csv";

    let slideAttuale = 1;

    function verificaPassword() {
        const password = document.getElementById('passwordInput').value;
        if (password === 'mammantonio') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'flex';
            avviaDashboard();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function avviaDashboard() {
        aggiornaOrologio();
        setInterval(aggiornaOrologio, 1000);
        caricaDatiMonitor();
        setInterval(ruotaSchermate, 15000); 
        setInterval(caricaDatiMonitor, 60000); 
    }

    function aggiornaOrologio() {
        const ora = new Date();
        document.getElementById('liveClock').innerText = ora.toLocaleTimeString('it-IT');
    }

    async function caricaDatiMonitor() {
        try {
            const resAule = await fetch(LINK_CSV_AULE);
            const dataAule = await resAule.text();
            renderTabellaAule(dataAule);

            const resIstr = await fetch(LINK_CSV_ISTRUTTORI);
            const dataIstr = await resIstr.text();
            renderTabellaIstruttori(dataIstr);
        } catch (error) {
            console.error("Errore nel caricamento dei dati:", error);
        }
    }

    function ruotaSchermate() {
        const s1 = document.getElementById('slideAule');
        const s2 = document.getElementById('slideIstruttori');
        const d1 = document.getElementById('dot1');
        const d2 = document.getElementById('dot2');

        if (slideAttuale === 1) {
            s1.classList.remove('active');
            s2.classList.add('active');
            d1.classList.remove('active');
            d2.classList.add('active');
            slideAttuale = 2;
        } else {
            s2.classList.remove('active');
            s1.classList.add('active');
            d2.classList.remove('active');
            d1.classList.add('active');
            slideAttuale = 1;
        }
    }

    function renderTabellaAule(csvText) {
        const righe = csvText.split(/\r?\n/);
        const tbody = document.getElementById('bodyAule');
        tbody.innerHTML = "";

        for (let i = 1; i < righe.length; i++) {
            if (!righe[i]) continue;
            const col = righe[i].split(',');
            if (col.length < 10) continue;

            const statoCamp = col[9].toUpperCase().trim();
            let badgeClass = "libera";
            let dot = "🟢";
            if(statoCamp === "OCCUPATA" || statoCamp === "OCCUPATO") {
                badgeClass = "occupata";
                dot = "🔴";
            }

            tbody.innerHTML += `
                <tr>
                    <td style="font-weight:700; color:#fff;">${col[0]}</td>
                    <td>${col[1]}</td>
                    <td style="color:var(--accent-gold); font-weight:600;">${col[2] || '-'}</td>
                    <td>${col[3] || '-'}</td>
                    <td>${col[4] || '-'}</td>
                    <td>${col[5] || '0'}</td>
                    <td>${col[6] || '-'}</td>
                    <td>${col[7] || '-'}</td>
                    <td>${col[8] || '-'}</td>
                    <td><span class="badge ${badgeClass}">${dot} ${statoCamp}</span></td>
                </tr>
            `;
        }
    }

    function renderTabellaIstruttori(csvText) {
        const righe = csvText.split(/\r?\n/);
        const tbodySinistra = document.getElementById('bodyIstruttoriSinistra');
        const tbodyDestra = document.getElementById('bodyIstruttoriDestra');
        
        tbodySinistra.innerHTML = "";
        tbodyDestra.innerHTML = "";

        // Filtra le righe valide
        const righeValide = [];
        for (let i = 1; i < righe.length; i++) {
            if (!righe[i]) continue;
            const col = righe[i].split(',');
            if (col.length >= 2) righeValide.push(col);
        }

        // Distribuisci nelle due colonne (max 9 a sinistra, il resto a destra)
        righeValide.forEach((col, index) => {
            const assenza = col[0].toUpperCase().trim();
            let badgeClass = "assente";
            let icon = "⚠️";
            let displayAssenza = col[0];

            if (assenza === "IN SEDE" || assenza === "PRESENTE" || assenza === "") {
                badgeClass = "insede";
                icon = "🛡️";
                displayAssenza = "IN SEDE";
            } else if (assenza === "LICENZA") {
                badgeClass = "licenza";
                icon = "🏖️";
            } else if (assenza === "MISSIONE") {
                badgeClass = "missione";
                icon = "✈️";
            }

            // Nota: Mostriamo solo Stato e Militare per ottimizzare la larghezza su 1024x768, 
            // ma se c'è un rientro (col[3]) lo iniettiamo accanto allo stato per non perdere info importanti.
            let infoData = col[3] ? ` (Fino al: ${col[3]})` : '';
            if(badgeClass === "insede") infoData = '';

            const stringaRiga = `
                <tr>
                    <td><span class="badge ${badgeClass}">${icon} ${displayAssenza}</span></td>
                    <td style="font-weight:600; color:#fff; font-size:1rem;">${col[1]}${infoData}</td>
                </tr>
            `;

            if (index < 9) {
                tbodySinistra.innerHTML += stringaRiga;
            } else {
                tbodyDestra.innerHTML += stringaRiga;
            }
        });
    }
</script>
</body>
</html>
