<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU Training Department Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --panel-bg: rgba(15, 15, 15, 0.85);
            --accent: #d4af37;
            --accent-hover: #b8921a;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --danger: #ef4444;
            --success: #22c55e;
            --whatsapp-green: #25D366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-color: #050505;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: -2; object-fit: cover;
        }

        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: -1;
        }

        .lang-bar { width: 100%; max-width: 1200px; display: flex; justify-content: flex-end; gap: 12px; margin: 0 auto 15px auto; z-index: 10; }
        .lang-btn { font-size: 1.5rem; cursor: pointer; filter: grayscale(0.6); transition: 0.3s; border: 2px solid transparent; border-radius: 4px; padding: 2px; }
        .lang-btn:hover, .lang-btn.active { filter: grayscale(0); transform: scale(1.15); border-color: var(--accent); }

        .main-grid {
            display: block;
            max-width: 1250px;
            width: 100%;
            margin: 0 auto;
        }
        
        @media (min-width: 992px) {
            .main-grid {
                display: table;
                table-layout: fixed;
                border-collapse: separate;
                border-spacing: 25px 0px;
            }
            .col-left { display: table-cell; width: 55%; vertical-align: top; }
            .col-right { display: table-cell; width: 45%; vertical-align: top; }
        }

        header { text-align: center; margin-bottom: 25px; }
        .logo-img { width: 120px; height: auto; margin-bottom: 12px; border-radius: 50%; box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); }
        h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        header p { color: var(--text-muted); font-size: 0.95rem; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
        
        /* Box QR Code Hub Generale */
        .qr-card { background: white; padding: 15px; border-radius: 16px; display: inline-block; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center;}
        .qr-card p { color: #0a0a0a; font-weight: 700; margin-top: 10px; font-size: 0.75rem; letter-spacing: 0.5px;}
        #qrcode img { margin: 0 auto; }

        /* Box QR Code WhatsApp Dinamico */
        .whatsapp-card { background: white; padding: 20px; border-radius: 16px; display: none; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3); text-align: center; border: 3px solid var(--whatsapp-green); animation: fadeIn 0.5s ease forwards; }
        .whatsapp-card p { color: #0a0a0a; font-weight: 700; margin-bottom: 12px; font-size: 0.85rem; letter-spacing: 0.3px; text-transform: uppercase;}
        .whatsapp-card .qr-holder { display: flex; justify-content: center; margin-bottom: 10px; }
        .whatsapp-card .wa-btn { display: inline-block; background: var(--whatsapp-green); color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; margin-top: 5px; transition: 0.2s; }
        .whatsapp-card .wa-btn:hover { background: #20ba59; transform: scale(1.02); }

        /* Pannello di Ricerca */
        .search-card { background: var(--panel-bg); padding: 22px; border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin-bottom: 25px; text-align: center; backdrop-filter: blur(10px); }
        .search-card h2 { font-size: 1.05rem; color: var(--accent); margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .search-box { display: flex; gap: 10px; max-width: 500px; margin: 0 auto; }
        .search-input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #444; background: rgba(30,30,30,0.8); color: #fff; font-size: 1rem; font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .search-input:focus { border-color: var(--accent); outline: none; }
        .search-btn { background: var(--accent); color: #000; font-weight: 700; padding: 0 24px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 0.85rem; }
        .search-btn:hover { background: var(--accent-hover); }

        /* Liste e Contenuti */
        .category-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--accent); margin: 20px 0 12px 5px; letter-spacing: 1px; border-left: 3px solid var(--accent); padding-left: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .resource-item { background: var(--panel-bg); padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; margin-bottom: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s; }
        .resource-item:hover { transform: translateY(-2px); border-color: rgba(212, 175, 55, 0.5); background: rgba(25, 25, 25, 0.9); }
        .file-info { display: flex; align-items: center; gap: 12px; text-align: left; }
        .file-icon { font-size: 1.4rem; }
        .file-name { font-weight: 600; display: block; margin-bottom: 2px; }
        .file-meta { font-size: 0.8rem; color: #cbd5e1; }
        .btn-download { background: var(--accent); color: #0a0a0a; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }

        /* SEZIONE DESTRA: PLAYER VIDEO E NOTIZIE */
        .media-panel { background: var(--panel-bg); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(10px); margin-bottom: 25px; text-align: center; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; margin-bottom: 15px; }
        
        .video-playlist { max-height: 140px; overflow-y: auto; text-align: left; margin-bottom: 20px; padding-right: 5px; }
        .playlist-item { padding: 10px; background: rgba(255,255,255,0.03); margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; transition: 0.2s; }
        .playlist-item:hover, .playlist-item.active { background: rgba(212, 175, 55, 0.1); border-color: var(--accent); }

        .news-panel { background: rgba(10, 10, 10, 0.9); border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); padding: 15px; text-align: left; }
        .news-panel h3 { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        
        .ticker-container { width: 100%; height: 160px; overflow: hidden; position: relative; background: #000; border-radius: 6px; border: 1px solid #222; }
        .ticker-wrapper { position: absolute; width: 100%; padding: 10px; animation: ticker-vertical 20s linear infinite; }
        .ticker-wrapper:hover { animation-play-state: paused; }
        
        .news-item { margin-bottom: 18px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 10px; }
        .news-item:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
        .news-title { font-weight: 700; color: var(--accent); font-size: 0.9rem; margin-bottom: 3px; text-transform: uppercase; }
        .news-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }

        @keyframes ticker-vertical {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-box { margin-top: 15px; font-size: 0.9rem; font-weight: 600; display: none; }
        .message-box.error { color: var(--danger); display: block; }
        .message-box.success { color: var(--success); display: block; }
        
        @media (max-width: 991px) { .col-left, .col-right { display: block; width: 100%; } .media-panel { margin-top: 25px; } }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="sfondo.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="lang-bar">
        <span class="lang-btn active" onclick="setLanguage('it')">🇮🇹</span>
        <span class="lang-btn" onclick="setLanguage('en')">🇬🇧</span>
        <span class="lang-btn" onclick="setLanguage('fr')">🇫🇷</span>
    </div>

    <div class="main-grid">
        
        <div class="col-left">
            <header>
                <img src="logo.jpeg" alt="CoESPU Logo" class="logo-img">
                <h1 id="mainTitle">CoESPU Resource HUB</h1>
                <p id="subTitle">Portale Supporto Logistico & Didattico</p>
            </header>

            <center>
                <div class="qr-card">
                    <div id="qrcode"></div>
                    <p id="qrText">SCANSIONA PER ACCEDERE AL PORTALE</p>
                </div>
            </center>

            <div class="search-card">
                <h2 id="searchTitle">Accesso Materiale Didattico</h2>
                <div class="search-box">
                    <input type="text" id="courseCodeInput" class="search-input" placeholder="Es: ALFA, BRAVO...">
                    <button onclick="sbloccaCorso()" class="search-btn" id="searchBtn">Accedi</button>
                </div>
                <div id="messageBox" class="message-box"></div>
            </div>

            <!-- BOX WHATSAPP DINAMICO -->
            <div class="whatsapp-card" id="whatsappCard">
                <p id="whatsappTitle">💬 Gruppo Ufficiale WhatsApp del Corso</p>
                <div class="qr-holder">
                    <div id="waQrcode"></div>
                </div>
                <a href="#" id="waLinkBtn" class="wa-btn" target="_blank">ENTRA NEL GRUPPO</a>
            </div>

            <div id="logisticaFissa"></div>
            <div id="didatticaDinamica"></div>
        </div>

        <div class="col-right">
            <div class="media-panel">
                <div class="category-title" style="margin-top:0;" id="panelMediaTitle">📺 Media & Training Feed</div>
                
                <!-- CONTAINER DEL PLAYER INTELLIGENTE (IFRAME EMBED) -->
                <div class="video-container" id="playerWrapper"></div>
                
                <div class="video-playlist" id="playlistContainer"></div>

                <div class="news-panel">
                    <h3 id="newsPanelTitle">📢 COESPU INFO & AVVISI UTILI</h3>
                    <div class="ticker-container">
                        <div class="ticker-wrapper" id="newsTickerWrapper"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

<script>
    const LINK_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?output=csv";

    const translations = {
        it: { subTitle: "Portale Supporto Logistico & Didattico", searchTitle: "Sblocco Materiale del Corso", placeholder: "Es: ALFA, BRAVO...", btnSearch: "Accedi", qrText: "SCANSIONA PER ACCEDERE AL PORTALE", catLogistica: "📍 Logistica e Orientamento Centro (CoESPU)", catDidattica: "📋 Risorse Didattiche Sbloccate", catAI: "🤖 Assistente Virtuale AI", dlText: "APRI / SCARICA", errInvalid: "Codice corso non valido o scaduto.", succValid: "Corso sbloccato con successo!", panelMediaTitle: "📺 Media & Training Feed", newsPanelTitle: "📢 COESPU INFO & AVVISI UTILI", waBtnText: "ENTRA NEL GRUPPO" },
        en: { subTitle: "Logistics & Training Support Portal", searchTitle: "Unlock Course Material", placeholder: "E.g.: ALFA, BRAVO...", btnSearch: "Access", qrText: "SCAN TO ACCESS THE PORTAL", catLogistica: "📍 Center Logistics & Orientation (CoESPU)", catDidattica: "📋 Unlocked Training Resources", catAI: "🤖 AI Virtual Assistant", dlText: "OPEN / DOWNLOAD", errInvalid: "Invalid or expired course code.", succValid: "Course unlocked successfully!", panelMediaTitle: "📺 Media & Training Feed", newsPanelTitle: "📢 COESPU INFO & USEFUL NOTICES", waBtnText: "JOIN THE GROUP" },
        fr: { subTitle: "Portail de Support Logistique & Pédagogique", searchTitle: "Déverrouiller le Matériel de Cours", placeholder: "Ex: ALFA, BRAVO...", btnSearch: "Entrer", qrText: "SCANNEZ POUR ACCÉDER AU PORTAIL", catLogistica: "📍 Logistique & Orientation du Centre (CoESPU)", catDidattica: "📋 Ressources Pédagogiques Déverrouillées", catAI: "🤖 Assistant Virtuel IA", dlText: "OUVRIR / TÉLÉCHARGER", errInvalid: "Code de cours invalide ou expiré.", succValid: "Cours déverrouillé avec succès!", panelMediaTitle: "📺 Flux Média & Entraînement", newsPanelTitle: "📢 COESPU INFO & AVIS UTILES", waBtnText: "REJOINDRE LE GROUPE" }
    };

    let currentLang = 'it';
    let databaseLogisticaFissa = [];
    let databaseCorsi = {};
    let databaseVideoFissi = [];
    let databaseNotizie = [];

    // Helper per separare le righe CSV gestendo correttamente virgolette e virgole
    function parseCSVLine(line) {
        let result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else {
                cur += char;
            }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    async function caricaDatiDaGoogle() {
        try {
            const response = await fetch(LINK_CSV);
            const data = await response.text();
            const righe = data.split(/\r?\n/);
            
            databaseLogisticaFissa = [];
            databaseCorsi = {};
            databaseVideoFissi = [];
            databaseNotizie = [];

            for (let i = 1; i < righe.length; i++) {
                if (!righe[i] || !righe[i].trim()) continue;
                const colonne = parseCSVLine(righe[i]);
                if (colonne.length < 7) continue;

                const idCorso = colonne[0].toLowerCase().trim();
                const scadenza = colonne[1].trim();
                const sezione = colonne[2].toLowerCase().trim();
                const nomeFile = colonne[3].trim();
                const infoFile = colonne[4].trim();
                const icona = colonne[5].trim();
                const urlDrive = colonne[6].trim();

                const elemento = { nome: nomeFile, meta: infoFile, icona: icona, url: urlDrive };

                if (sezione === 'notizia') {
                    databaseNotizie.push(elemento);
                } else if (sezione === 'video') {
                    if (idCorso === 'coespu') {
                        databaseVideoFissi.push(elemento);
                    } else {
                        if (!databaseCorsi[idCorso]) databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [], video: [], whatsapp: null };
                        databaseCorsi[idCorso].video.push(elemento);
                    }
                } else if (sezione === 'whatsapp') {
                    if (!databaseCorsi[idCorso]) databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [], video: [], whatsapp: null };
                    databaseCorsi[idCorso].whatsapp = elemento;
                } else if (idCorso === 'coespu' || sezione === 'logistica') {
                    databaseLogisticaFissa.push(elemento);
                } else {
                    if (!databaseCorsi[idCorso]) databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [], video: [], whatsapp: null };
                    if (sezione === 'didattica' || sezione === 'ai') {
                        databaseCorsi[idCorso][sezione].push(elemento);
                    }
                }
            }

            renderLogisticaFissa();
            renderPlaylistVideo(databaseVideoFissi);
            renderNotizieTicker();
            
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: window.location.href, width: 140, height: 140, colorDark: "#0a0a0a", correctLevel: QRCode.CorrectLevel.H });
        } catch (error) {
            console.error("Errore nel caricamento del CSV:", error);
        }
    }

    function renderPlaylistVideo(listaVideo) {
        const container = document.getElementById('playlistContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        container.innerHTML = "";

        if (listaVideo.length === 0) {
            container.innerHTML = "<p style='font-size:0.8rem;color:#666;padding:10px;'>Nessun video disponibile</p>";
            playerWrapper.innerHTML = "";
            return;
        }

        attivaVideoEmbed(listaVideo[0].url);

        listaVideo.forEach((v, index) => {
            const item = document.createElement('div');
            item.className = "playlist-item" + (index === 0 ? " active" : "");
            item.innerHTML = `<span>${v.icona || '🎥'}</span><div><strong>${v.nome}</strong><br><span style='font-size:0.75rem;color:#aaa'>${v.meta}</span></div>`;
            item.onclick = function() {
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                attivaVideoEmbed(v.url);
            };
            container.appendChild(item);
        });
    }

    function attivaVideoEmbed(urlOriginario) {
        const playerWrapper = document.getElementById('playerWrapper');
        let embedUrl = urlOriginario;

        if (urlOriginario.includes("drive.google.com")) {
            let idFile = "";
            if (urlOriginario.includes("/file/d/")) {
                idFile = urlOriginario.split("/file/d/")[1].split("/")[0];
            } else if (urlOriginario.includes("id=")) {
                idFile = urlOriginario.split("id=")[1].split("&")[0];
            }
            if (idFile) {
                embedUrl = `https://drive.google.com/file/d/${idFile}/preview`;
            }
        } else if (urlOriginario.includes("youtube.com/watch?v=")) {
            let idVideo = urlOriginario.split("v=")[1].split("&")[0];
            embedUrl = `https://www.youtube.com/embed/${idVideo}`;
        } else if (urlOriginario.includes("youtu.be/")) {
            let idVideo = urlOriginario.split("youtu.be/")[1].split("?")[0];
            embedUrl = `https://www.youtube.com/embed/${idVideo}`;
        }

        playerWrapper.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" style="border:none;" allow="autoplay" allowfullscreen></iframe>`;
    }

    function renderNotizieTicker() {
        const container = document.getElementById('newsTickerWrapper');
        container.innerHTML = "";
        if (databaseNotizie.length === 0) {
            container.innerHTML = "<div class='news-item'><div class='news-title'>Nessun avviso</div><div class='news-desc'>Nessuna comunicazione recente per i corsi.</div></div>";
            return;
        }
        databaseNotizie.forEach(n => {
            container.innerHTML += `<div class="news-item"><div class="news-title">${n.nome}</div><div class="news-desc">${n.meta}</div></div>`;
        });
    }

    function renderLogisticaFissa() {
        const container = document.getElementById('logisticaFissa');
        if (databaseLogisticaFissa.length === 0) return;
        let html = `<div class="category-title">${translations[currentLang].catLogistica}</div>`;
        databaseLogisticaFissa.forEach(f => {
            html += `
                <a href="${f.url}" class="resource-item" target="_blank">
                    <div class="file-info">
                        <span class="file-icon">${f.icona}</span>
                        <div>
                            <span class="file-name">${f.nome}</span>
                            <span class="file-meta">${f.meta}</span>
                        </div>
                    </div>
                    <div class="btn-download">${translations[currentLang].dlText}</div>
                </a>`;
        });
        container.innerHTML = html;
    }

    function sbloccaCorso() {
        const inputCode = document.getElementById('courseCodeInput').value.toLowerCase().trim();
        const msgBox = document.getElementById('messageBox');
        const containerDinamico = document.getElementById('didatticaDinamica');
        const waCard = document.getElementById('whatsappCard');
        const waQrContainer = document.getElementById('waQrcode');
        
        containerDinamico.innerHTML = "";
        waCard.style.display = "none";
        waQrContainer.innerHTML = "";

        if (!inputCode || !databaseCorsi[inputCode]) {
            msgBox.className = "message-box error";
            msgBox.innerText = translations[currentLang].errInvalid;
            renderPlaylistVideo(databaseVideoFissi);
            return;
        }

        const corso = databaseCorsi[inputCode];
        const oggi = new Date();
        const dataScadenza = new Date(corso.scadenza);
        dataScadenza.setHours(23, 59, 59, 999);

        if (oggi > dataScadenza) {
            msgBox.className = "message-box error";
            msgBox.innerText = translations[currentLang].errInvalid;
            return;
        }

        msgBox.className = "message-box success";
        msgBox.innerText = translations[currentLang].succValid;

        if (corso.whatsapp && corso.whatsapp.url) {
            document.getElementById('whatsappTitle').innerText = corso.whatsapp.nome || `💬 Gruppo WhatsApp [${inputCode.toUpperCase()}]`;
            document.getElementById('waLinkBtn').href = corso.whatsapp.url;
            waCard.style.display = "block";
            
            new QRCode(waQrContainer, {
                text: corso.whatsapp.url,
                width: 150, height: 150,
                colorDark: "#128C7E", colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        let htmlDinamico = "";
        if (corso.didattica.length > 0) {
            htmlDinamico += `<div class="category-title">${translations[currentLang].catDidattica} [${inputCode.toUpperCase()}]</div>`;
            corso.didattica.forEach(f => {
                htmlDinamico += `
                    <a href="${f.url}" class="resource-item" target="_blank">
                        <div class="file-info">
                            <span class="file-icon">${f.icona}</span>
                            <div>
                                <span class="file-name">${f.nome}</span>
                                <span class="file-meta">${f.meta}</span>
                            </div>
                        </div>
                        <div class="btn-download">${translations[currentLang].dlText}</div>
                    </a>`;
            });
        }

        if (corso.ai.length > 0) {
            htmlDinamico += `<div class="category-title">${translations[currentLang].catAI}</div>`;
            corso.ai.forEach(f => {
                htmlDinamico += `
                    <a href="${f.url}" class="resource-item" target="_blank">
                        <div class="file-info">
                            <span class="file-icon">${f.icona}</span>
                            <div>
                                <span class="file-name">${f.nome}</span>
                                <span class="file-meta">${f.meta}</span>
                            </div>
                        </div>
                        <div class="btn-download">${translations[currentLang].dlText}</div>
                    </a>`;
            });
        }

        containerDinamico.innerHTML = htmlDinamico;

        let videoPlaylistAttuale = [...databaseVideoFissi];
        if (corso.video && corso.video.length > 0) {
            videoPlaylistAttuale = [...corso.video, ...databaseVideoFissi];
        }
        renderPlaylistVideo(videoPlaylistAttuale);
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('subTitle').innerText = translations[lang].subTitle;
        document.getElementById('searchTitle').innerText = translations[lang].searchTitle;
        document.getElementById('courseCodeInput').placeholder = translations[lang].placeholder;
        document.getElementById('searchBtn').innerText = translations[lang].btnSearch;
        document.getElementById('qrText').innerText = translations[lang].qrText;
        document.getElementById('panelMediaTitle').innerText = translations[lang].panelMediaTitle;
        document.getElementById('newsPanelTitle').innerText = translations[lang].newsPanelTitle;
        document.getElementById('waLinkBtn').innerText = translations[lang].waBtnText;
        renderLogisticaFissa();
        const inputVal = document.getElementById('courseCodeInput').value;
        if(inputVal) sbloccaCorso();
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(window.event && window.event.currentTarget) window.event.currentTarget.classList.add('active');
    }

    // Caricamento immediato all'avvio
    document.addEventListener("DOMContentLoaded", caricaDatiDaGoogle);
</script>
</body>
</html>
