<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU Training Department Resource HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(18, 18, 20, 0.85);
            --panel-border: rgba(212, 175, 55, 0.25);
            --panel-border-hover: rgba(212, 175, 55, 0.6);
            --accent: #d4af37;
            --accent-hover: #f0c84b;
            --accent-glow: rgba(212, 175, 55, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --whatsapp-green: #25D366;
            --whatsapp-hover: #20ba59;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 70px !important; /* Spazio di sicurezza per la barra ANSA fissa */
            background-color: var(--bg-dark);
            overflow-x: hidden;
            line-height: 1.5;
        }

        .video-background {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: -2; object-fit: cover;
        }

        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(5,5,5,0.75) 0%, rgba(0,0,0,0.92) 100%);
            z-index: -1;
        }

        /* Container Full Width */
        .hub-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header Superiore con QR a destra */
        .top-header-grid {
            display: grid;
            grid-template-columns: 1fr;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            position: relative;
        }

        @media (min-width: 768px) {
            .top-header-grid {
                grid-template-columns: 120px 1fr 140px;
            }
        }

        .header-center {
            text-align: center;
            grid-column: 1 / -1;
        }

        @media (min-width: 768px) {
            .header-center {
                grid-column: 2;
            }
        }

        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            transition: transform 0.3s ease;
            display: block;
        }

        .logo-img:hover { transform: scale(1.03); }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .header-center p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* QR Code & Multilingua in Alto a Destra */
        .top-right-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            justify-self: center;
        }

        @media (min-width: 768px) {
            .top-right-box {
                justify-self: end;
            }
        }

        .lang-bar {
            display: flex;
            gap: 6px;
        }

        .lang-btn {
            font-size: 1.2rem;
            cursor: pointer;
            filter: grayscale(0.7);
            transition: all 0.25s;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 2px 6px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        .lang-btn:hover, .lang-btn.active {
            filter: grayscale(0);
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .mini-qr-card {
            background: #ffffff;
            padding: 8px;
            border-radius: var(--radius-md);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            text-align: center;
        }

        .mini-qr-card p {
            color: #0f172a;
            font-weight: 800;
            margin-top: 4px;
            font-size: 0.55rem;
            letter-spacing: 0.5px;
        }

        /* Card Generica */
        .card {
            background: var(--panel-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--panel-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
            padding: 22px;
            margin-bottom: 24px;
            transition: border-color 0.3s ease;
        }

        .card:hover { border-color: var(--panel-border-hover); }

        /* Search Card Principale */
        .search-title {
            font-size: 0.88rem;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(10, 10, 12, 0.8);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            outline: none;
            background: rgba(15, 15, 20, 0.95);
        }

        .search-btn {
            background: var(--accent);
            color: #050505;
            font-weight: 700;
            padding: 0 24px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .search-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Layout Grid Principale (2 Colonne) */
        .main-content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 992px) {
            .main-content-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Box WhatsApp Dinamico */
        .whatsapp-card {
            background: rgba(18, 18, 20, 0.95);
            padding: 20px;
            border-radius: var(--radius-lg);
            display: none;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.15);
            text-align: center;
            border: 2px solid var(--whatsapp-green);
            animation: fadeIn 0.4s ease forwards;
        }

        .whatsapp-title {
            color: var(--whatsapp-green);
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .whatsapp-card .qr-holder {
            display: flex;
            justify-content: center;
            margin: 10px auto 14px auto;
            background: #fff;
            padding: 10px;
            border-radius: var(--radius-md);
            width: fit-content;
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--whatsapp-green);
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .wa-btn:hover {
            background: var(--whatsapp-hover);
            transform: translateY(-2px);
        }

        /* Sezione Risorse ed Elementi Lista */
        .category-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
            margin: 20px 0 12px 0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.3), transparent);
        }

        .resource-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
        }

        .resource-item:hover {
            transform: translateX(4px);
            border-color: var(--accent);
            background: rgba(212, 175, 55, 0.08);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon { font-size: 1.4rem; width: 28px; text-align: center; }
        .file-name { font-weight: 600; display: block; font-size: 0.9rem; color: var(--text-main); }
        .file-meta { font-size: 0.78rem; color: var(--text-muted); }

        .btn-download {
            background: var(--accent);
            color: #050505;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* Mappa Interattiva Google My Maps */
        .map-container {
            width: 100%;
            height: 380px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--panel-border);
            margin-bottom: 10px;
            background: rgba(0,0,0,0.4);
        }

        .map-container iframe { width: 100%; height: 100%; border: 0; }

        .map-actions { display: flex; justify-content: flex-end; }

        .btn-map-fullscreen {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            background: rgba(212, 175, 55, 0.1);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.2s;
        }

        .btn-map-fullscreen:hover { background: var(--accent); color: #050505; }

        /* Media Player & Playlist */
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 14px;
        }

        .video-playlist {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 4px;
        }

        .video-playlist::-webkit-scrollbar { width: 4px; }
        .video-playlist::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 4px; }

        .playlist-item {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .playlist-item:hover, .playlist-item.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent);
        }

        /* BARRA SCORREVOLE FISSA IN FONDO ALLA PAGINA (STILE ANSA) */
        .ansa-ticker-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            background: rgba(10, 10, 12, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            overflow: hidden;
            margin: 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
            height: 42px;
        }

        .ansa-ticker-label {
            background: var(--accent);
            color: #050505;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            z-index: 2;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
        }

        .ansa-ticker-content {
            flex: 1;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .ansa-ticker-track {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            animation: ticker-horizontal 30s linear infinite;
            padding-left: 100%;
        }

        .ansa-ticker-track:hover {
            animation-play-state: paused;
            cursor: pointer;
        }

        .ansa-news-item {
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .ansa-news-title {
            font-weight: 700;
            color: var(--accent);
            margin-right: 6px;
        }

        .ansa-news-desc {
            color: var(--text-muted);
        }

        .ansa-news-separator {
            margin: 0 30px;
            color: var(--accent);
            opacity: 0.6;
            font-size: 0.7rem;
        }

        @keyframes ticker-horizontal {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-box {
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            text-align: center;
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .message-box.error {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .message-box.success {
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="sfondo.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="hub-wrapper">
        
        <!-- HEADER SUPERIORE BILANCIATO -->
        <div class="top-header-grid">
            <div></div>

            <!-- Centro: Stemma e Titoli -->
            <div class="header-center">
                <img src="logo.jpeg" alt="CoESPU Logo" class="logo-img">
                <h1 id="mainTitle">CoESPU Resource HUB</h1>
                <p id="subTitle">Portale Supporto Logistico & Didattico</p>
            </div>

            <!-- Alto Destra: QR Code & Lingua -->
            <div class="top-right-box">
                <div class="lang-bar">
                    <span class="lang-btn active" onclick="setLanguage('it')" title="Italiano">🇮🇹</span>
                    <span class="lang-btn" onclick="setLanguage('en')" title="English">🇬🇧</span>
                    <span class="lang-btn" onclick="setLanguage('fr')" title="Français">🇫🇷</span>
                </div>
                <div class="mini-qr-card">
                    <div id="qrcode"></div>
                    <p id="qrText">LINK PORTALE</p>
                </div>
            </div>
        </div>

        <!-- BARRA DI RICERCA / SBLOCCO CORSI IN EVIDENZA -->
        <div class="card">
            <div class="search-title" id="searchTitle">Accesso Materiale Didattico</div>
            <div class="search-box">
                <input type="text" id="courseCodeInput" class="search-input" placeholder="Es: ALFA, BRAVO..." autocomplete="off">
                <button onclick="sbloccaCorso()" class="search-btn" id="searchBtn">Accedi</button>
            </div>
            <div id="messageBox" class="message-box"></div>
        </div>

        <!-- LAYOUT GRID A 2 COLONNE FULL WIDTH -->
        <div class="main-content-grid">
            
            <!-- COLONNA SINISTRA: Logistica, Didattica, WhatsApp -->
            <div class="col-left">
                <!-- BOX WHATSAPP DINAMICO -->
                <div class="whatsapp-card" id="whatsappCard">
                    <div class="whatsapp-title" id="whatsappTitle">💬 Gruppo Ufficiale WhatsApp del Corso</div>
                    <div class="qr-holder">
                        <div id="waQrcode"></div>
                    </div>
                    <a href="#" id="waLinkBtn" class="wa-btn" target="_blank">ENTRA NEL GRUPPO</a>
                </div>

                <!-- RISORSE LOGISTICHE E DIDATTICHE -->
                <div id="logisticaFissa"></div>
                <div id="didatticaDinamica"></div>
            </div>

            <!-- COLONNA DESTRA: Mappa e Video -->
            <div class="col-right">
                <!-- MAPPA INTERATTIVA GOOGLE MY MAPS -->
                <div class="card">
                    <div class="category-title" style="margin-top:0;" id="panelMapTitle">🗺️ Mappa Interattiva CoESPU</div>
                    <div class="map-container">
                        <!-- Inserisci qui il tuo link Embed di Google My Maps -->
                        <iframe id="googleMapIframe" src="https://www.google.com/maps/d/u/1/embed?mid=1kdT4lt5nWbnOroW669LdgrngyoZ9dU0&ehbc=2E312F" allowfullscreen loading="lazy"></iframe>
                    </div>
                    <div class="map-actions">
                        <a href="https://www.google.com/maps/d/u/1/embed?mid=1kdT4lt5nWbnOroW669LdgrngyoZ9dU0&ehbc=2E312F" id="mapFullscreenBtn" target="_blank" class="btn-map-fullscreen">
                            <span>⛶</span> <span id="mapFullscreenText">Apri a schermo intero</span>
                        </a>
                    </div>
                </div>

                <!-- MEDIA FEED -->
                <div class="card">
                    <div class="category-title" style="margin-top:0;" id="panelMediaTitle">📺 Media & Training Feed</div>
                    <div class="video-container" id="playerWrapper"></div>
                    <div class="video-playlist" id="playlistContainer"></div>
                </div>
            </div>

        </div>

    </div>

    <!-- BARRA AVVISI FISSA IN FONDO ALLA PAGINA (STILE ANSA) -->
    <div class="ansa-ticker-bar">
        <div class="ansa-ticker-label" id="newsPanelTitle">📢 INFO & AVVISI</div>
        <div class="ansa-ticker-content">
            <div class="ansa-ticker-track" id="newsTickerWrapper"></div>
        </div>
    </div>

<script>
    const LINK_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?output=csv";

    const translations = {
        it: { subTitle: "Portale Supporto Logistico & Didattico", searchTitle: "Sblocco Materiale del Corso", placeholder: "Es: ALFA, BRAVO...", btnSearch: "Accedi", qrText: "LINK PORTALE", catLogistica: "📍 Logistica e Orientamento Centro (CoESPU)", catDidattica: "📋 Risorse Didattiche Sbloccate", catAI: "🤖 Assistente Virtuale AI", dlText: "APRI / SCARICA", errInvalid: "Codice corso non valido o scaduto.", succValid: "Corso sbloccato con successo!", panelMediaTitle: "📺 Media & Training Feed", newsPanelTitle: "📢 INFO & AVVISI", waBtnText: "ENTRA NEL GRUPPO", panelMapTitle: "🗺️ Mappa Interattiva CoESPU", mapFullscreenText: "Apri a schermo intero" },
        en: { subTitle: "Logistics & Training Support Portal", searchTitle: "Unlock Course Material", placeholder: "E.g.: ALFA, BRAVO...", btnSearch: "Access", qrText: "PORTAL LINK", catLogistica: "📍 Center Logistics & Orientation (CoESPU)", catDidattica: "📋 Unlocked Training Resources", catAI: "🤖 AI Virtual Assistant", dlText: "OPEN / DOWNLOAD", errInvalid: "Invalid or expired course code.", succValid: "Course unlocked successfully!", panelMediaTitle: "📺 Media & Training Feed", newsPanelTitle: "📢 INFO & NOTICES", waBtnText: "JOIN THE GROUP", panelMapTitle: "🗺️ CoESPU Interactive Map", mapFullscreenText: "Open full screen" },
        fr: { subTitle: "Portail de Support Logistique & Pédagogique", searchTitle: "Déverrouiller le Matériel de Cours", placeholder: "Ex: ALFA, BRAVO...", btnSearch: "Entrer", qrText: "LIEN PORTAIL", catLogistica: "📍 Logistique & Orientation du Centre (CoESPU)", catDidattica: "📋 Ressources Pédagogiques Déverrouillées", catAI: "🤖 Assistant Virtuel IA", dlText: "OUVRIR / TÉLÉCHARGER", errInvalid: "Code de cours invalide ou expiré.", succValid: "Cours déverrouillé avec succès!", panelMediaTitle: "📺 Flux Média & Entraînement", newsPanelTitle: "📢 INFO & AVIS", waBtnText: "REJOINDRE LE GROUPE", panelMapTitle: "🗺️ Carte Interactive CoESPU", mapFullscreenText: "Ouvrir en plein écran" }
    };

    let currentLang = 'it';
    let databaseLogisticaFissa = [];
    let databaseCorsi = {};
    let databaseVideoFissi = [];
    let databaseNotizie = [];

    function parseCSVLine(line) {
        let result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else {
                cur += char;
            }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    async function caricaDatiDaGoogle() {
        try {
            const response = await fetch(LINK_CSV);
            const data = await response.text();
            const righe = data.split(/\r?\n/);
            
            databaseLogisticaFissa = [];
            databaseCorsi = {};
            databaseVideoFissi = [];
            databaseNotizie = [];

            for (let i = 1; i < righe.length; i++) {
                if (!righe[i] || !righe[i].trim()) continue;
                const colonne = parseCSVLine(righe[i]);
                if (colonne.length < 7) continue;

                const idCorso = colonne[0].toLowerCase().trim();
                const scadenza = colonne[1].trim();
                const sezione = colonne[2].toLowerCase().trim();
                const nomeFile = colonne[3].trim();
                const infoFile = colonne[4].trim();
                const icona = colonne[5].trim();
                const urlDrive = colonne[6].trim();

                const elemento = { nome: nomeFile, meta: infoFile, icona: icona, url: urlDrive };

                if (sezione === 'notizia') {
                    databaseNotizie.push(elemento);
                } else if (sezione === 'video') {
                    if (idCorso === 'coespu') {
                        databaseVideoFissi.push(elemento);
                    } else {
                        if (!databaseCorsi[idCorso]) databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [], video: [], whatsapp: null };
                        databaseCorsi[idCorso].video.push(elemento);
                    }
                } else if (sezione === 'whatsapp') {
                    if (!databaseCorsi[idCorso]) databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [], video: [], whatsapp: null };
                    databaseCorsi[idCorso].whatsapp = elemento;
                } else if (idCorso === 'coespu' || sezione === 'logistica') {
                    databaseLogisticaFissa.push(elemento);
                } else {
                    if (!databaseCorsi[idCorso]) databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [], video: [], whatsapp: null };
                    if (sezione === 'didattica' || sezione === 'ai') {
                        databaseCorsi[idCorso][sezione].push(elemento);
                    }
                }
            }

            renderLogisticaFissa();
            renderPlaylistVideo(databaseVideoFissi);
            renderNotizieTicker();
            
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: window.location.href, width: 85, height: 85, colorDark: "#0a0a0a", correctLevel: QRCode.CorrectLevel.H });
        } catch (error) {
            console.error("Errore nel caricamento del CSV:", error);
        }
    }

    function renderPlaylistVideo(listaVideo) {
        const container = document.getElementById('playlistContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        container.innerHTML = "";

        if (listaVideo.length === 0) {
            container.innerHTML = "<p style='font-size:0.8rem;color:var(--text-muted);padding:10px;'>Nessun video disponibile</p>";
            playerWrapper.innerHTML = "";
            return;
        }

        attivaVideoEmbed(listaVideo[0].url);

        listaVideo.forEach((v, index) => {
            const item = document.createElement('div');
            item.className = "playlist-item" + (index === 0 ? " active" : "");
            item.innerHTML = `<span>${v.icona || '🎥'}</span><div><strong>${v.nome}</strong><br><span style='font-size:0.75rem;color:var(--text-muted)'>${v.meta}</span></div>`;
            item.onclick = function() {
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                attivaVideoEmbed(v.url);
            };
            container.appendChild(item);
        });
    }

    function attivaVideoEmbed(urlOriginario) {
        const playerWrapper = document.getElementById('playerWrapper');
        let embedUrl = urlOriginario;

        if (urlOriginario.includes("drive.google.com")) {
            let idFile = "";
            if (urlOriginario.includes("/file/d/")) {
                idFile = urlOriginario.split("/file/d/")[1].split("/")[0];
            } else if (urlOriginario.includes("id=")) {
                idFile = urlOriginario.split("id=")[1].split("&")[0];
            }
            if (idFile) {
                embedUrl = `https://drive.google.com/file/d/${idFile}/preview`;
            }
        } else if (urlOriginario.includes("youtube.com/watch?v=")) {
            let idVideo = urlOriginario.split("v=")[1].split("&")[0];
            embedUrl = `https://www.youtube.com/embed/${idVideo}`;
        } else if (urlOriginario.includes("youtu.be/")) {
            let idVideo = urlOriginario.split("youtu.be/")[1].split("?")[0];
            embedUrl = `https://www.youtube.com/embed/${idVideo}`;
        }

        playerWrapper.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" style="border:none;" allow="autoplay" allowfullscreen></iframe>`;
    }

    function renderNotizieTicker() {
        const container = document.getElementById('newsTickerWrapper');
        container.innerHTML = "";

        if (databaseNotizie.length === 0) {
            container.innerHTML = `
                <div class="ansa-news-item">
                    <span class="ansa-news-title">CoESPU:</span>
                    <span class="ansa-news-desc">Nessuna comunicazione o avviso recente.</span>
                </div>`;
            return;
        }

        let html = "";
        databaseNotizie.forEach((n, index) => {
            html += `
                <div class="ansa-news-item">
                    <span class="ansa-news-title">${n.nome}:</span>
                    <span class="ansa-news-desc">${n.meta}</span>
                </div>`;
            
            if (index < databaseNotizie.length - 1) {
                html += `<span class="ansa-news-separator">◆</span>`;
            }
        });

        container.innerHTML = html;
    }

    function renderLogisticaFissa() {
        const container = document.getElementById('logisticaFissa');
        if (databaseLogisticaFissa.length === 0) return;
        let html = `<div class="category-title">${translations[currentLang].catLogistica}</div>`;
        databaseLogisticaFissa.forEach(f => {
            html += `
                <a href="${f.url}" class="resource-item" target="_blank">
                    <div class="file-info">
                        <span class="file-icon">${f.icona}</span>
                        <div>
                            <span class="file-name">${f.nome}</span>
                            <span class="file-meta">${f.meta}</span>
                        </div>
                    </div>
                    <div class="btn-download">${translations[currentLang].dlText}</div>
                </a>`;
        });
        container.innerHTML = html;
    }

    function sbloccaCorso() {
        const inputCode = document.getElementById('courseCodeInput').value.toLowerCase().trim();
        const msgBox = document.getElementById('messageBox');
        const containerDinamico = document.getElementById('didatticaDinamica');
        const waCard = document.getElementById('whatsappCard');
        const waQrContainer = document.getElementById('waQrcode');
        
        containerDinamico.innerHTML = "";
        waCard.style.display = "none";
        waQrContainer.innerHTML = "";

        if (!inputCode || !databaseCorsi[inputCode]) {
            msgBox.className = "message-box error";
            msgBox.innerText = translations[currentLang].errInvalid;
            renderPlaylistVideo(databaseVideoFissi);
            return;
        }

        const corso = databaseCorsi[inputCode];
        const oggi = new Date();
        const dataScadenza = new Date(corso.scadenza);
        dataScadenza.setHours(23, 59, 59, 999);

        if (oggi > dataScadenza) {
            msgBox.className = "message-box error";
            msgBox.innerText = translations[currentLang].errInvalid;
            return;
        }

        msgBox.className = "message-box success";
        msgBox.innerText = translations[currentLang].succValid;

        if (corso.whatsapp && corso.whatsapp.url) {
            document.getElementById('whatsappTitle').innerText = corso.whatsapp.nome || `💬 Gruppo WhatsApp [${inputCode.toUpperCase()}]`;
            document.getElementById('waLinkBtn').href = corso.whatsapp.url;
            waCard.style.display = "block";
            
            new QRCode(waQrContainer, {
                text: corso.whatsapp.url,
                width: 120, height: 120,
                colorDark: "#128C7E", colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        let htmlDinamico = "";
        if (corso.didattica.length > 0) {
            htmlDinamico += `<div class="category-title">${translations[currentLang].catDidattica} [${inputCode.toUpperCase()}]</div>`;
            corso.didattica.forEach(f => {
                htmlDinamico += `
                    <a href="${f.url}" class="resource-item" target="_blank">
                        <div class="file-info">
                            <span class="file-icon">${f.icona}</span>
                            <div>
                                <span class="file-name">${f.nome}</span>
                                <span class="file-meta">${f.meta}</span>
                            </div>
                        </div>
                        <div class="btn-download">${translations[currentLang].dlText}</div>
                    </a>`;
            });
        }

        if (corso.ai.length > 0) {
            htmlDinamico += `<div class="category-title">${translations[currentLang].catAI}</div>`;
            corso.ai.forEach(f => {
                htmlDinamico += `
                    <a href="${f.url}" class="resource-item" target="_blank">
                        <div class="file-info">
                            <span class="file-icon">${f.icona}</span>
                            <div>
                                <span class="file-name">${f.nome}</span>
                                <span class="file-meta">${f.meta}</span>
                            </div>
                        </div>
                        <div class="btn-download">${translations[currentLang].dlText}</div>
                    </a>`;
            });
        }

        containerDinamico.innerHTML = htmlDinamico;

        let videoPlaylistAttuale = [...databaseVideoFissi];
        if (corso.video && corso.video.length > 0) {
            videoPlaylistAttuale = [...corso.video, ...databaseVideoFissi];
        }
        renderPlaylistVideo(videoPlaylistAttuale);
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('subTitle').innerText = translations[lang].subTitle;
        document.getElementById('searchTitle').innerText = translations[lang].searchTitle;
        document.getElementById('courseCodeInput').placeholder = translations[lang].placeholder;
        document.getElementById('searchBtn').innerText = translations[lang].btnSearch;
        document.getElementById('qrText').innerText = translations[lang].qrText;
        document.getElementById('panelMediaTitle').innerText = translations[lang].panelMediaTitle;
        document.getElementById('newsPanelTitle').innerText = translations[lang].newsPanelTitle;
        document.getElementById('waLinkBtn').innerText = translations[lang].waBtnText;
        document.getElementById('panelMapTitle').innerText = translations[lang].panelMapTitle;
        document.getElementById('mapFullscreenText').innerText = translations[lang].mapFullscreenText;
        
        renderLogisticaFissa();
        const inputVal = document.getElementById('courseCodeInput').value;
        if(inputVal) sbloccaCorso();
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(window.event && window.event.currentTarget) window.event.currentTarget.classList.add('active');
    }

    document.addEventListener("DOMContentLoaded", () => {
        caricaDatiDaGoogle();
        const input = document.getElementById('courseCodeInput');
        input.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                sbloccaCorso();
            }
        });
    });
</script>
</body>
</html>
