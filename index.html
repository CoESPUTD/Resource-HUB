<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU - Operational Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-bg: rgba(16, 22, 42, 0.9);
            --accent-gold: #d4af37;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Login */
        #loginScreen { background: rgba(16, 22, 42, 0.95); padding: 30px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.4); text-align: center; margin: 8vh auto 0 auto; max-width: 380px; width: 100%; }
        .lock-icon { font-size: 2.5rem; margin-bottom: 10px; display: inline-block; }
        #loginScreen h2 { margin-bottom: 20px; color: var(--text-main); font-size: 1.2rem; text-transform: uppercase; }
        #loginScreen h2 span { color: var(--accent-gold); font-size: 0.85rem; display: block; margin-top: 5px; }
        .pass-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(10, 15, 29, 0.8); color: white; text-align: center; font-size: 1.1rem; margin-bottom: 15px; letter-spacing: 3px; }
        .login-btn { background: linear-gradient(135deg, #b8921a, var(--accent-gold)); color: #05050a; font-weight: 700; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }

        /* Dashboard */
        #dashboardContent { display: none; width: 100%; height: calc(100vh - 30px); flex-direction: column; }
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; flex-shrink: 0; }
        header h1 { font-size: 1.5rem; color: var(--text-main); font-weight: 700; }
        header h1 span { color: var(--accent-gold); font-weight: 400; }
        .clock { font-size: 1.3rem; font-weight: 600; color: var(--accent-gold); background: rgba(212, 175, 55, 0.1); padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.2); }

        .slide-container { flex-grow: 1; position: relative; width: 100%; }
        .panel { background: var(--panel-bg); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); padding: 15px; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; display: flex; flex-direction: column; }
        .panel.active { opacity: 1; pointer-events: auto; }
        
        .panel-title { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; color: var(--text-main); margin-bottom: 10px; border-bottom: 2px solid var(--accent-gold); padding-bottom: 6px; width: fit-content; flex-shrink: 0; }

        /* Tabelle - Ottimizzazione Spazi Verticali */
        .table-responsive { overflow: hidden; flex-grow: 1; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; color: #e5e7eb; table-layout: fixed; }
        th { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); padding: 6px 4px; font-weight: 600; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.1); font-size: 0.75em; }
        td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }

        /* Slide Aule - Font base dinamico */
        #tableAule { font-size: 0.9rem; }

        /* Slide Istruttori */
        #slideIstruttori table { font-size: 1rem; }
        .split-tables-container { display: flex; gap: 20px; width: 100%; flex-grow: 1; overflow: hidden; }
        .split-column { width: 50%; display: flex; flex-direction: column; }

        .dots-indicator { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-shrink: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.3s; }
        .dot.active { background: var(--accent-gold); box-shadow: 0 0 6px var(--accent-gold); }

        .badge { padding: 2px 5px; border-radius: 4px; font-weight: 700; text-transform: uppercase; display: inline-flex; align-items: center; gap: 3px; font-size: 0.8em; }
        .badge.insede { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge.licenza { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge.missione { background: rgba(59, 130, 246, 0.15); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge.assente { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .sub-plan { display: block; font-size: 0.72em; opacity: 0.75; line-height: 1.2; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginScreen">
        <span class="lock-icon">🦅</span>
        <h2>Training Dept. <span>Operational Board</span></h2>
        <input type="password" id="passwordInput" class="pass-input" placeholder="PASSWORD" onkeydown="if(event.key==='Enter') verificaPassword()">
        <button onclick="verificaPassword()" class="login-btn">Accedi</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardContent">
        <header>
            <h1>Training Dept. | <span>Operational Board</span></h1>
            <div class="clock" id="liveClock">00:00:00</div>
        </header>

        <div class="slide-container">
            <!-- SCHERMATA 1: TUTTE LE AULE (Con nuove larghezze bilanciate) -->
            <div class="panel active" id="slideAule">
                <div class="panel-title">🏛️ Monitoraggio Aree Addestrative & Aule</div>
                <div class="table-responsive">
                    <table id="tableAule">
                        <thead>
                            <tr>
                                <th style="width:14%">Aula</th>
                                <th style="width:28%">Corso</th>
                                <th style="width:9%">Dal</th>
                                <th style="width:9%">Al</th>
                                <th style="width:6%">Pres.</th>
                                <th style="width:22%">Manager / Assistant</th>
                                <th style="width:12%">Stato</th>
                            </tr>
                        </thead>
                        <tbody id="bodyAule"></tbody>
                    </table>
                </div>
            </div>

            <!-- SCHERMATA 2: ISTRUTTORI (Con supporto a licenze multiple) -->
            <div class="panel" id="slideIstruttori">
                <div class="panel-title">👥 Stato d'Impiego Personale / Istruttori</div>
                <div class="split-tables-container">
                    <div class="split-column"><table id="tableIstrSinistra"><thead><tr><th style="width:35%">Stato</th><th style="width:65%">Militare</th></tr></thead><tbody id="bodyIstrSinistra"></tbody></table></div>
                    <div class="split-column"><table id="tableIstrDestra"><thead><tr><th style="width:35%">Stato</th><th style="width:65%">Militare</th></tr></thead><tbody id="bodyIstrDestra"></tbody></table></div>
                </div>
            </div>
        </div>

        <div class="dots-indicator">
            <div class="dot active" id="dot1"></div><div class="dot" id="dot2"></div>
        </div>
    </div>

<script>
    const LINK_CSV_AULE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?gid=1402761773&single=true&output=csv";
    const LINK_CSV_ISTRUTTORI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?gid=87992488&single=true&output=csv";

    function verificaPassword() {
        if (document.getElementById('passwordInput').value === 'mammantonio') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'flex';
            avviaDashboard();
        }
    }

    function avviaDashboard() {
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('it-IT'); }, 1000);
        caricaDatiMonitor();
        setInterval(caricaDatiMonitor, 60000);
        
        let fase = 1;
        setInterval(() => {
            const panels = ['slideAule', 'slideIstruttori'];
            panels.forEach(id => document.getElementById(id).classList.remove('active'));
            [1,2].forEach(i => document.getElementById('dot'+i).classList.remove('active'));
            
            fase = fase === 1 ? 2 : 1;
            document.getElementById(panels[fase-1]).classList.add('active');
            document.getElementById('dot'+fase).classList.add('active');
        }, 15000);
    }

    async function caricaDatiMonitor() {
        try {
            const [resA, resI] = await Promise.all([fetch(LINK_CSV_AULE), fetch(LINK_CSV_ISTRUTTORI)]);
            renderAule(await resA.text());
            renderIstruttori(await resI.text());
        } catch (e) { console.error(e); }
    }

    function renderAule(csv) {
        const rows = csv.split(/\r?\n/).filter(r => r.split(',').length >= 10).slice(1);
        const body = document.getElementById('bodyAule');
        body.innerHTML = "";
        
        rows.forEach((r) => {
            const c = r.split(',');
            const stato = c[9].toUpperCase().trim();
            const badge = stato.includes("OCCUP") ? `<span class="badge assente">🔴 ${stato}</span>` : `<span class="badge insede">🟢 ${stato}</span>`;
            const staff = `${c[7] || '-'} / ${c[8] || '-'}`;
            
            body.innerHTML += `<tr><td><b>${c[0]}</b></td><td>${c[2]||'-'}</td><td>${c[3]||'-'}</td><td>${c[4]||'-'}</td><td>${c[5]||'0'}</td><td style="font-size:0.88em; color:var(--text-muted);">${staff}</td><td>${badge}</td></tr>`;
        });

        // AUTO-FIT FONT AULE
        const numRows = rows.length;
        const containerHeight = 550;
        let dynamicSize = Math.min(1.1, containerHeight / (numRows * 33)); 
        document.getElementById('tableAule').style.fontSize = dynamicSize + "rem";
    }

    function renderIstruttori(csv) {
        const rows = csv.split(/\r?\n/).filter(r => r.split(',').length >= 2).slice(1);
        const bodyS = document.getElementById('bodyIstrSinistra'), bodyD = document.getElementById('bodyIstrDestra');
        bodyS.innerHTML = ""; bodyD.innerHTML = "";
        
        const oggi = new Date(); oggi.setHours(0,0,0,0);
        const mappaMilitari = {};

        // 1. Raggruppa i dati per militare gestendo licenze/missioni multiple
        rows.forEach((r) => {
            const c = r.split(',');
            const statoTab = c[0].toUpperCase().trim();
            const mil = c[1]?.trim();
            if (!mil) return;

            const dDal = parseDate(c[2]);
            const dAl = parseDate(c[3]);

            if (!mappaMilitari[mil]) {
                mappaMilitari[mil] = { nome: mil, statoAttuale: "IN SEDE", pianificazioni: [] };
            }

            if (dDal && dAl) {
                if (oggi >= dDal && oggi <= dAl) {
                    mappaMilitari[mil].statoAttuale = statoTab || "ASSENTE";
                    mappaMilitari[mil].periodoAttuale = `Dal ${c[2]} al ${c[3]}`;
                } else if (oggi < dDal) {
                    mappaMilitari[mil].pianificazioni.push({
                        stato: statoTab,
                        dal: c[2],
                        al: c[3],
                        dataObj: dDal
                    });
                }
            } else if (statoTab && statoTab !== "IN SEDE") {
                mappaMilitari[mil].statoAttuale = statoTab;
            }
        });

        const listaMilitari = Object.values(mappaMilitari);

        // 2. Renderizza la tabella
        listaMilitari.forEach((m, i) => {
            let bCl = "insede", icon = "🛡️", st = m.statoAttuale;
            let subHtml = "";

            if (st === "LICENZA") { bCl = "licenza"; icon = "🏖️"; }
            else if (st === "MISSIONE") { bCl = "missione"; icon = "✈️"; }
            else if (st !== "IN SEDE") { bCl = "assente"; icon = "⚠️"; }

            if (m.periodoAttuale) {
                subHtml += `<span class="sub-plan">Dal ${m.periodoAttuale}</span>`;
            }

            // Ordina e genera tutte le pianificazioni future
            if (m.pianificazioni.length > 0) {
                m.pianificazioni.sort((a,b) => a.dataObj - b.dataObj);
                m.pianificazioni.forEach(p => {
                    subHtml += `<span class="sub-plan">📅 Prox: <b>${p.stato}</b> (${p.dal}${p.al ? ' - '+p.al : ''})</span>`;
                });
            }

            const html = `<tr><td><span class="badge ${bCl}">${icon} ${st}</span></td><td><b>${m.nome}</b>${subHtml}</td></tr>`;
            if (i < Math.ceil(listaMilitari.length / 2)) bodyS.innerHTML += html; else bodyD.innerHTML += html;
        });

        // AUTO-FIT FONT ISTRUTTORI (adattato alla presenza di sotto-righe)
        const maxRows = Math.ceil(listaMilitari.length / 2);
        const containerHeight = 540;
        let dynamicSize = Math.min(1.2, containerHeight / (maxRows * 38));
        
        document.getElementById('tableIstrSinistra').style.fontSize = dynamicSize + "rem";
        document.getElementById('tableIstrDestra').style.fontSize = dynamicSize + "rem";
    }

    function parseDate(s) {
        if (!s) return null;
        const p = s.trim().split(/[-/]/);
        return p.length < 2 ? null : new Date(p[2] || new Date().getFullYear(), p[1]-1, p[0]);
    }
</script>
</body>
</html>
