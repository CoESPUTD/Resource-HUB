<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoESPU Training Department Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --panel-bg: rgba(15, 15, 15, 0.85);
            --accent: #d4af37;
            --accent-hover: #b8921a;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: -2; object-fit: cover;
        }

        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        .lang-bar { width: 100%; max-width: 750px; display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 20px; z-index: 10; }
        .lang-btn { font-size: 1.5rem; cursor: pointer; filter: grayscale(0.6); transition: 0.3s; border: 2px solid transparent; border-radius: 4px; padding: 2px; }
        .lang-btn:hover, .lang-btn.active { filter: grayscale(0); transform: scale(1.15); border-color: var(--accent); }

        .hub-container { max-width: 750px; width: 100%; z-index: 5; }

        header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        .logo-img { width: 140px; height: auto; margin-bottom: 15px; border-radius: 50%; box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); }
        h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        header p { color: var(--text-muted); font-size: 0.95rem; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
        
        /* Box QR Code Fisso */
        .qr-card { background: white; padding: 20px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .qr-card p { color: #0a0a0a; font-weight: 700; margin-top: 12px; font-size: 0.8rem; text-align: center; letter-spacing: 0.5px;}

        /* Pannello di Ricerca Corso */
        .search-card { background: var(--panel-bg); padding: 25px; border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin-bottom: 30px; text-align: center; backdrop-filter: blur(10px); }
        .search-card h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .search-box { display: flex; gap: 10px; max-width: 500px; margin: 0 auto; }
        .search-input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #444; background: rgba(30,30,30,0.8); color: #fff; font-size: 1rem; font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .search-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(212,175,55,0.2); }
        .search-btn { background: var(--accent); color: #000; font-weight: 700; padding: 0 24px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 0.85rem; }
        .search-btn:hover { background: var(--accent-hover); }

        .category-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--accent); margin: 25px 0 12px 5px; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); border-left: 3px solid var(--accent); padding-left: 8px; }
        .resource-item { background: var(--panel-bg); padding: 18px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; margin-bottom: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s ease; }
        .resource-item:hover { transform: translateY(-2px); border-color: rgba(212, 175, 55, 0.5); background: rgba(25, 25, 25, 0.9); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-icon { font-size: 1.5rem; }
        .file-name { font-weight: 600; display: block; margin-bottom: 2px; }
        .file-meta { font-size: 0.85rem; color: #cbd5e1; }

        .btn-download { background: var(--accent); color: #0a0a0a; padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; transition: 0.2s; white-space: nowrap; }
        .resource-item:hover .btn-download { background: var(--accent-hover); }

        .message-box { margin-top: 15px; font-size: 0.9rem; font-weight: 600; display: none; }
        .message-box.error { color: var(--danger); display: block; }
        .message-box.success { color: var(--success); display: block; }
        
        @media print { .lang-bar, .category-title, .resource-item, .video-background, .video-overlay, .search-card { display: none; } }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="sfondo.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="lang-bar">
        <span class="lang-btn active" onclick="setLanguage('it')">🇮🇹</span>
        <span class="lang-btn" onclick="setLanguage('en')">🇬🇧</span>
        <span class="lang-btn" onclick="setLanguage('fr')">🇫🇷</span>
    </div>

    <div class="hub-container">
        <header>
            <img src="logo.jpeg" alt="CoESPU Logo" class="logo-img">
            <h1 id="mainTitle">CoESPU Resource HUB</h1>
            <p id="subTitle">Training Department Portal</p>
        </header>

        <div class="qr-card">
            <div id="qrcode"></div>
            <p id="qrText">SCANSIONA PER ACCEDERE AL PORTALE</p>
        </div>

        <div class="search-card">
            <h2 id="searchTitle">Accesso Materiale Didattico</h2>
            <div class="search-box">
                <input type="text" id="courseCodeInput" class="search-input" placeholder="Inserisci Codice Corso...">
                <button onclick="sbloccaCorso()" class="search-btn" id="searchBtn">Accedi</button>
            </div>
            <div id="messageBox" class="message-box"></div>
        </div>

        <div id="logisticaFissa"></div>
        <div id="didatticaDinamica"></div>
    </div>

<script>
    // ==========================================================
    // LINK DI GOOGLE FOGLI CORRETTO (PUBBLICATO COME CSV)
    // ==========================================================
    const LINK_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVrz56Xv-4GdQ0Mzvc2QY7MEUGxEO3k1ITsDfJkVuxjBqa0E7DwEsujCgtrIIir1nnZF_SMCStZxl5/pub?output=csv";

    const translations = {
        it: { subTitle: "Portale Supporto Logistico & Didattico", searchTitle: "Sblocco Materiale del Corso", placeholder: "Es: ALFA, BRAVO...", btnSearch: "Accedi", qrText: "SCANSIONA PER ACCEDERE AL PORTALE", catLogistica: "📍 Logistica e Orientamento Centro (CoESPU)", catDidattica: "📋 Risorse Didattiche Sbloccate", catAI: "🤖 Assistente Virtuale AI", dlText: "APRI / SCARICA", errInvalid: "Codice corso non valido o scaduto.", succValid: "Corso sbloccato con successo!", loading: "Sincronizzazione dati in corso..." },
        en: { subTitle: "Logistics & Training Support Portal", searchTitle: "Unlock Course Material", placeholder: "E.g.: ALFA, BRAVO...", btnSearch: "Access", qrText: "SCAN TO ACCESS THE PORTAL", catLogistica: "📍 Center Logistics & Orientation (CoESPU)", catDidattica: "📋 Unlocked Training Resources", catAI: "🤖 AI Virtual Assistant", dlText: "OPEN / DOWNLOAD", errInvalid: "Invalid or expired course code.", succValid: "Course unlocked successfully!", loading: "Synchronizing data..." },
        fr: { subTitle: "Portail di Support Logistique & Pédagogique", searchTitle: "Déverrouiller le Matériel de Cours", placeholder: "Ex: ALFA, BRAVO...", btnSearch: "Entrer", qrText: "SCANNEZ POUR ACCÉDER AU PORTAIL", catLogistica: "📍 Logistique & Orientation du Centre (CoESPU)", catDidattica: "📋 Ressources Pédagogiques Déverrouillées", catAI: "🤖 Assistant Virtuel IA", dlText: "OUVRIR / TÉLÉCHARGER", errInvalid: "Code de cours invalide ou expiré.", succValid: "Cours déverrouillé avec succès!", loading: "Sincronisation des données..." }
    };

    let currentLang = 'it';
    let databaseLogisticaFissa = [];
    let databaseCorsi = {};
    let qrcodeObj = null;

    async function caricaDatiDaGoogle() {
        try {
            const response = await fetch(LINK_CSV);
            const data = await response.text();
            const righe = data.split(/\r?\n/);
            
            databaseLogisticaFissa = [];
            databaseCorsi = {};

            for (let i = 1; i < righe.length; i++) {
                if (!righe[i]) continue;
                const colonne = righe[i].split(',');
                if (colonne.length < 7) continue;

                const idCorso = colonne[0].toLowerCase().trim();
                const scadenza = colonne[1].trim();
                const sezione = colonne[2].toLowerCase().trim();
                const nomeFile = colonne[3].trim();
                const infoFile = colonne[4].trim();
                const icona = colonne[5].trim();
                const urlDrive = colonne[6].trim();

                const elemento = { nome: nomeFile, meta: infoFile, icona: icona, url: urlDrive };

                if (idCorso === 'coespu' || sezione === 'logistica') {
                    databaseLogisticaFissa.push(elemento);
                } else {
                    if (!databaseCorsi[idCorso]) {
                        databaseCorsi[idCorso] = { scadenza: scadenza, didattica: [], ai: [] };
                    }
                    if (sezione === 'didattica' || sezione === 'ai') {
                        databaseCorsi[idCorso][sezione].push(elemento);
                    }
                }
            }
            renderLogisticaFissa();
            generaQRCode();
        } catch (error) {
            console.error("Errore nel caricamento del CSV:", error);
        }
    }

    function generaQRCode() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // Svuota
        qrcodeObj = new QRCode(qrContainer, {
            text: window.location.href,
            width: 170, height: 170,
            colorDark : "#0a0a0a", colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    function renderLogisticaFissa() {
        const container = document.getElementById('logisticaFissa');
        if (databaseLogisticaFissa.length === 0) return;

        let html = `<div class="category-title">${translations[currentLang].catLogistica}</div><div class="resource-list">`;
        databaseLogisticaFissa.forEach(f => {
            html += `
                <a href="${f.url}" class="resource-item" target="_blank">
                    <div class="file-info">
                        <span class="file-icon">${f.icona}</span>
                        <div>
                            <span class="file-name">${f.nome}</span>
                            <span class="file-meta">${f.meta}</span>
                        </div>
                    </div>
                    <div class="btn-download">${translations[currentLang].dlText}</div>
                </a>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    function sbloccaCorso() {
        const inputCode = document.getElementById('courseCodeInput').value.toLowerCase().trim();
        const msgBox = document.getElementById('messageBox');
        const containerDinamico = document.getElementById('didatticaDinamica');
        
        containerDinamico.innerHTML = "";

        if (!inputCode || !databaseCorsi[inputCode]) {
            msgBox.className = "message-box error";
            msgBox.innerText = translations[currentLang].errInvalid;
            return;
        }

        const corso = databaseCorsi[inputCode];
        const oggi = new Date();
        const dataScadenza = new Date(corso.scadenza);
        dataScadenza.setHours(23, 59, 59, 999);

        if (oggi > dataScadenza) {
            msgBox.className = "message-box error";
            msgBox.innerText = translations[currentLang].errInvalid;
            return;
        }

        msgBox.className = "message-box success";
        msgBox.innerText = translations[currentLang].succValid;

        let htmlDinamico = "";
        
        if (corso.didattica.length > 0) {
            htmlDinamico += `<div class="category-title">${translations[currentLang].catDidattica} [${inputCode.toUpperCase()}]</div><div class="resource-list">`;
            corso.didattica.forEach(f => {
                htmlDinamico += `
                    <a href="${f.url}" class="resource-item" target="_blank">
                        <div class="file-info">
                            <span class="file-icon">${f.icona}</span>
                            <div>
                                <span class="file-name">${f.nome}</span>
                                <span class="file-meta">${f.meta}</span>
                            </div>
                        </div>
                        <div class="btn-download">${translations[currentLang].dlText}</div>
                    </a>`;
            });
            htmlDinamico += `</div>`;
        }

        if (corso.ai.length > 0) {
            htmlDinamico += `<div class="category-title">${translations[currentLang].catAI}</div><div class="resource-list">`;
            corso.ai.forEach(f => {
                htmlDinamico += `
                    <a href="${f.url}" class="resource-item" target="_blank">
                        <div class="file-info">
                            <span class="file-icon">${f.icona}</span>
                            <div>
                                <span class="file-name">${f.nome}</span>
                                <span class="file-meta">${f.meta}</span>
                            </div>
                        </div>
                        <div class="btn-download">${translations[currentLang].dlText}</div>
                    </a>`;
            });
            htmlDinamico += `</div>`;
        }

        containerDinamico.innerHTML = htmlDinamico;
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('subTitle').innerText = translations[lang].subTitle;
        document.getElementById('searchTitle').innerText = translations[lang].searchTitle;
        document.getElementById('courseCodeInput').placeholder = translations[lang].placeholder;
        document.getElementById('searchBtn').innerText = translations[lang].btnSearch;
        document.getElementById('qrText').innerText = translations[lang].qrText;
        renderLogisticaFissa();
        const inputVal = document.getElementById('courseCodeInput').value;
        if(inputVal) sbloccaCorso();
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(event && event.currentTarget) event.currentTarget.classList.add('active');
    }

    window.onload = function() {
        caricaDatiDaGoogle();
    };
</script>
</body>
</html>
